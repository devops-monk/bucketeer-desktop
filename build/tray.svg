<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The menu bar mark: the same pail, drawn as an outline rather than a silhouette.

    A filled shape reads as a heavy black blob beside the system's own icons, which are
    all light strokes with air inside them. The stroke is 2 units of this 32 canvas, so
    it lands on exactly 1 physical pixel at 16pt and 2 at retina — the weight the rest of
    the menu bar is drawn at.

    Inset to roughly three quarters of the canvas for the same reason: an icon drawn edge
    to edge sits visibly larger than its neighbours even at the correct pixel size.

    macOS template images are tinted by the system — black becomes white in dark mode and
    inverts again when the menu is open — so this carries no colour of its own.
  -->
  <g
    fill="none"
    stroke="#000000"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- The handle, hooked over the rim on both sides. -->
    <path d="M11.9 11.4a4.4 4.4 0 0 1 8.2 0" />
    <!-- The rim, and the pail tapering below it. -->
    <path d="M7.6 12.4h16.8" />
    <path d="M9.1 12.4 10.7 24a1.6 1.6 0 0 0 1.6 1.4h7.4a1.6 1.6 0 0 0 1.6-1.4l1.6-11.6" />
  </g>
</svg>
