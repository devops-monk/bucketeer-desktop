<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The menu bar mark: the same pail, drawn as a flat black silhouette on transparency.

    macOS template images are tinted by the system — black becomes white in dark mode and
    inverts again when the menu is open — so this must carry no colour of its own, and
    detail has to survive at 16 logical pixels.
  -->
  <g fill="#000000">
    <path d="M6 11h20l-2.1 14.2c-.13.9-.9 1.55-1.8 1.55H9.9c-.9 0-1.67-.65-1.8-1.55z" />
    <ellipse cx="16" cy="11" rx="10" ry="2.9" />
    <path d="M16 3.2c3.6 0 6.6 2.6 7.2 6h-2.6a4.7 4.7 0 0 0-9.2 0H8.8c.6-3.4 3.6-6 7.2-6z" />
  </g>
</svg>
