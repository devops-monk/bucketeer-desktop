<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Bucketeer's app mark: a pail, in Very's brand pink (#DE007B).

    Built as one high-contrast silhouette rather than an outline drawing, because the
    icon has to survive 16px in a dock, a taskbar, and an alt-tab switcher, where thin
    strokes and interior detail turn to mud. The only interior element is the elliptical
    opening, which is what makes it read as a pail rather than a bag or a cup — and it
    stays legible because it is a large shape, not a line.
  -->
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FF3D96" />
      <stop offset="0.55" stop-color="#DE007B" />
      <stop offset="1" stop-color="#BE006C" />
    </linearGradient>

    <!-- Light falling from the upper left, so the tile has a surface rather than a fill. -->
    <radialGradient id="sheen" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- The pail's interior: the same pink, deepened, so the opening reads as depth. -->
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E0052" />
      <stop offset="1" stop-color="#C00069" />
    </linearGradient>

    <!-- Volume on the pail's right flank. -->
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#7A0046" stop-opacity="0.13" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#tile)" />
  <rect width="1024" height="1024" rx="228" fill="url(#sheen)" />

  <!-- Handle, drawn first so its ends disappear behind the rim. -->
  <path
    d="M 292 360 A 220 220 0 0 1 732 360"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="40"
    stroke-linecap="round"
    opacity="0.95"
  />

  <!-- Body: tapered, with an elliptical rim at the top and a rounded base. -->
  <path
    d="M 244 352 L 332 786 A 180 46 0 0 0 692 786 L 780 352 A 268 66 0 0 1 244 352 Z"
    fill="#FFFFFF"
  />
  <path
    d="M 244 352 L 332 786 A 180 46 0 0 0 692 786 L 780 352 A 268 66 0 0 1 244 352 Z"
    fill="url(#shade)"
  />

  <!-- The opening. -->
  <ellipse cx="512" cy="352" rx="268" ry="66" fill="url(#inside)" />
  <!-- A thin white lip catches the light along the front of the rim. -->
  <path
    d="M 244 352 A 268 66 0 0 0 780 352 A 268 52 0 0 1 244 352 Z"
    fill="#FFFFFF"
    opacity="0.55"
  />
</svg>
