appId: app.bucketeer.desktop
productName: Bucketeer
copyright: Copyright © 2026 Bucketeer contributors

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

# The AWS SDK is bundled into the main chunk, so nothing needs unpacking at runtime.
asar: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Network access for S3 and STS; the sandbox denies it by default.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  # Ad-hoc signature. Without any signature at all, macOS reports the app as "damaged
  # and can't be opened" instead of merely untrusted — and on Apple Silicon it refuses
  # to launch outright. This does not replace a Developer ID: users still see an
  # unidentified-developer warning, but the app opens after right-click → Open.
  identity: '-'

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  # Debian packages require a maintainer. Using the GitHub noreply address keeps a
  # personal inbox out of every .deb's metadata while still being a routable contact.
  maintainer: devops-monk <devops-monk@users.noreply.github.com>
  # Without a desktop entry name, Linux desktops cannot associate the running window
  # with its launcher icon.
  synopsis: Desktop client for Amazon S3 and S3-compatible storage
  syncDesktopName: true
  target:
    - AppImage
    - deb
