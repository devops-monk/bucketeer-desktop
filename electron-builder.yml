appId: app.bucketeer.desktop
productName: Bucketeer
copyright: Copyright © 2026 Bucketeer contributors

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  # The tray icon is read at runtime by path, so it has to be inside the app. The @2x
  # file is never named in code — macOS picks it up beside the 1x one — so leaving it
  # out silently gives every retina Mac a soft, scaled-up icon.
  - build/tray.png
  - build/tray@2x.png

# The AWS SDK is bundled into the main chunk, so nothing needs unpacking at runtime.
asar: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Network access for S3 and STS; the sandbox denies it by default.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  # Ad-hoc signature, used only because there is no Developer ID yet. Without any
  # signature at all, macOS reports the app as "damaged and can't be opened" rather than
  # merely untrusted, and on Apple Silicon refuses to launch outright.
  #
  # REMOVE THIS LINE once a Developer ID certificate is available, so electron-builder
  # finds the real certificate instead. See docs/mac-code-signing.md, step 7.
  identity: '-'

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  # Debian packages require a maintainer. Using the GitHub noreply address keeps a
  # personal inbox out of every .deb's metadata while still being a routable contact.
  maintainer: devops-monk <devops-monk@users.noreply.github.com>
  # Without a desktop entry name, Linux desktops cannot associate the running window
  # with its launcher icon.
  synopsis: Desktop client for Amazon S3 and S3-compatible storage
  syncDesktopName: true
  target:
    - AppImage
    - deb
