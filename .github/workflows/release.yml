name: Release

on:
  push:
    # Tags cut a real release; pushes to main publish a rolling development build.
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A newer push to main makes an in-flight development build pointless. Tag builds are
# never cancelled — a half-published release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    name: Package ${{ matrix.name }}
    # Lets you skip a ten-minute build for a README fix: put [skip build] in the message.
    if: "!contains(github.event.head_commit.message, '[skip build]')"
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away installers that already built.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            command: npx electron-builder --mac --publish never
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            name: Windows
            command: npx electron-builder --win --publish never
            artifacts: release/*.exe
          - os: ubuntu-latest
            name: Linux
            command: npx electron-builder --linux --publish never
            artifacts: |
              release/*.AppImage
              release/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder names artifacts from package.json. A tag build takes the tag's
      # version; a development build appends -dev, deliberately without a run number, so
      # filenames stay stable and each run replaces the previous assets rather than
      # accumulating hundreds of them on one release.
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          else
            base=$(node -p "require('./package.json').version")
            npm version "${base%-dev}-dev" --no-git-tag-version --allow-same-version
          fi

      - name: Test
        run: npm test

      - name: Typecheck and build bundles
        run: npm run build

      # Signs and notarizes when the Apple secrets exist, and falls back to the ad-hoc
      # build when they do not — so adding them later needs no change here.
      # See docs/mac-code-signing.md for how to obtain them.
      - name: Package installers
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Looking for a certificate that is not there fails the job rather than
          # producing an unsigned build, so discovery stays off until one is supplied.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: bucketeer-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Describe this build
        id: describe
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "notes=true" >> "$GITHUB_OUTPUT"
          else
            # One long-lived "dev" release that always points at the newest main commit.
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "name=Development build (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "notes=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ steps.describe.outputs.tag }}
          name: ${{ steps.describe.outputs.name }}
          prerelease: ${{ steps.describe.outputs.prerelease }}
          generate_release_notes: ${{ steps.describe.outputs.notes }}
          # A development build is whatever main looked like at that moment, so its notes
          # point at the commit rather than pretending to be a curated changelog.
          body: |
            ${{ steps.describe.outputs.prerelease == 'true' && format('Built from main at {0}. Unreleased and unsupported — expect breakage.', github.sha) || '' }}

            ## Installing

            These builds carry only an ad-hoc signature and are **not notarized**, so
            every OS will warn you:

            - **macOS** — right-click the app and choose Open (macOS 14 and earlier), or
              open it once and then allow it under System Settings → Privacy & Security
              (macOS 15+). To skip the prompt entirely:
              `xattr -dr com.apple.quarantine /Applications/Bucketeer.app`
            - **Windows** — SmartScreen shows "unrecognised app"; choose More info, then Run anyway
            - **Linux** — `chmod +x` the AppImage before running it

            Bucketeer stores AWS credentials in your system keychain and sends them
            nowhere but AWS.
